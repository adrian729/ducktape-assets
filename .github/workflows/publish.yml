# The single publisher. Manual dispatch only (no schedule, no emails). Two jobs:
#   plan:    no secrets, no id-token. Clones every registered set repo, computes inputsHash per set, compares with npm,
#            builds what changed, writes the table to the run summary, outputs the list of packages to publish.
#   publish: environment "release" (required reviewer = owner, one approval per run). Rebuilds the changed sets from the
#            same cache, publishes with trusted publishing (OIDC), index package last, verifies on jsDelivr, commits a release record.
# Every trust configuration on npm is bound to: repo adrian729/ducktape-assets, workflow publish.yml, environment release.
name: publish
on:
  workflow_dispatch:
    inputs:
      sets:
        description: "Comma-separated set ids to consider (empty = every active set)"
        required: false
        default: ""
      dry_run:
        description: "Plan only, never publish"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: tools/package-lock.json }
      - run: npm ci
        working-directory: tools
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: .ducktape-cache
          key: publish-${{ runner.os }}-${{ github.run_id }}
          restore-keys: publish-${{ runner.os }}-
      - name: Plan
        id: plan
        run: node tools/src/cli.mjs plan --sets "${{ inputs.sets }}" --cache .ducktape-cache --summary "$GITHUB_STEP_SUMMARY" --output plan.json
      - uses: actions/upload-artifact@v4
        with: { name: plan, path: plan.json, retention-days: 30 }

  publish:
    needs: plan
    if: ${{ needs.plan.outputs.packages != '[]' && !inputs.dry_run }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write      # release records are committed back to main
      id-token: write      # npm trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: "https://registry.npmjs.org", cache: npm, cache-dependency-path: tools/package-lock.json }
      - run: npm ci
        working-directory: tools
      - uses: actions/download-artifact@v4
        with: { name: plan }
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: .ducktape-cache
          key: publish-${{ runner.os }}-${{ github.run_id }}
          restore-keys: publish-${{ runner.os }}-
      - name: Publish everything in the plan (idempotent; "already published" is success)
        run: node tools/src/cli.mjs publish --plan plan.json --cache .ducktape-cache --record releases/
      - name: Verify on jsDelivr and record
        run: node tools/src/cli.mjs check-cdn --plan plan.json --record releases/
      - name: Commit release record
        run: |
          git config user.name "ducktape-assets publisher"
          git config user.email "noreply@github.com"
          git add releases/ index/
          git commit -m "Release record for run ${{ github.run_id }}" || echo "nothing to commit"
          git push
      - name: Deploy to the fallback CDN (only when armed; see docs/vault/Design/CDN contingency.md)
        if: ${{ vars.CDN_PROVIDER == 'cloudflare' }}
        run: node tools/src/cli.mjs deploy-cdn --plan plan.json
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
