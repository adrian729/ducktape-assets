# Reusable workflow called by every set repository's ci.yml. Validates metadata, builds into a temp dir (drafts included,
# for the preview), enforces the size guard, and uploads a contact-sheet preview as an artifact on pull requests.
# No publishing, no id-token. The tooling is checked out from this repository at `tools_ref`, so nothing is needed from npm.
name: set-ci
on:
  workflow_call:
    inputs:
      tools_ref:
        description: "Ref of adrian729/ducktape-assets to take the tooling and schemas from"
        type: string
        default: main
permissions:
  contents: read
  pull-requests: write
jobs:
  validate-and-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out the tooling
        uses: actions/checkout@v4
        with:
          repository: adrian729/ducktape-assets
          ref: ${{ inputs.tools_ref }}
          path: .ducktape
          sparse-checkout: |
            tools
            schemas
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: .ducktape/tools/package-lock.json }
      - run: npm ci
        working-directory: .ducktape/tools
      - name: Validate
        run: node .ducktape/tools/src/cli.mjs validate .
      - name: Build and preview (drafts included)
        run: node .ducktape/tools/src/cli.mjs build . --out .ducktape-out --preview --include-drafts --version 0.0.0
      - name: Upload preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: |
            .ducktape-out/preview.html
            .ducktape-out/webp/*-256.webp
          retention-days: 14
      - name: Comment sizes on the PR
        if: github.event_name == 'pull_request'
        run: |
          node -e '
            const m = require("./.ducktape-out/manifest.json");
            const n = Object.keys(m.assets).length;
            const bytes = Object.values(m.assets).flatMap(a => [...(a.sources.webp||[]), ...(a.sources.avif||[])]).reduce((s,f)=>s+f.bytes,0);
            const avif = Object.values(m.assets).filter(a => a.sources.avif?.length).length;
            const drafts = (m.drafts||[]).length;
            console.log(`### Build preview\n\n${n} assets (${drafts} drafts), ${(bytes/1e6).toFixed(1)} MB of delivery files, AVIF kept for ${avif}/${n}. Download the "preview" artifact for the contact sheet.`);
          ' > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
        env: { GH_TOKEN: "${{ github.token }}" }
